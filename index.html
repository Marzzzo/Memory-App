<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory App</title>
  </head>
  <body>
    <div id="app">
      <main class="settings-main">
        <section class="settings-content">
          <header class="settings-content__header">
            <h1>Settings</h1>
            <img src="/assets/yellow_setting_line.svg" alt="" />
          </header>
          <div class="themes-content">
            <fieldset class="theme">
              <legend class="theme__legend-content">
                <img src="/assets/theme_icon.svg" alt="" />
                <span>Game themes</span>
              </legend>
              <label class="label" for="">
                <img src="/assets/checkbox.svg" alt="" />
                <span>Code vibes theme</span>
              </label>
              <label class="label" for="">
                <img src="/assets/checkbox.svg" alt="" />
                <span>Gaming</span>
              </label>
            </fieldset>

            <fieldset class="theme">
              <legend class="theme__legend-content">
                <img src="/assets/choose_player_icon.svg" alt="" />
                <span>Choose player</span>
              </legend>
              <label class="label" for="">
                <img src="/assets/checkbox.svg" alt="" />
                <span>Blue</span>
              </label>
              <label class="label" for="">
                <img src="/assets/checkbox.svg" alt="" />
                <span>Orange</span>
              </label>
            </fieldset>

            <fieldset class="theme">
              <legend class="theme__legend-content">
                <img src="/assets/board_icon.svg" alt="" />
                <span>Board size</span>
              </legend>
              <label class="label" for="">
                <img src="/assets/checkbox.svg" alt="" />
                <span>16 cards</span>
              </label>
              <label class="label" for="">
                <img src="/assets/checkbox.svg" alt="" />
                <span>24 cards</span>
              </label>
              <label class="label" for="">
                <img src="/assets/checkbox.svg" alt="" />
                <span>36 cards</span>
              </label>
            </fieldset>
            <img src="/public/assets/vibes_theme_img.png" alt="" />
            <div class="selected-board">
              <div class="selected-board__text">
                <span>Game theme</span>
                <div class="selected-board__slash"></div>
                <span>Player</span>
                <div class="selected-board__slash"></div>
                <span>Board size</span>
              </div>
              <button class="board-button">
                <img src="/public/assets/play_icon.svg" alt="play-icon" />
                <span>Start</span>
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/ts/main.ts"></script>
  </body>
</html>
